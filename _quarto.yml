project:
  type: website
  output-dir: docs        # GitHub Pages publishes from docs/ directory
  render:
    - "*.qmd"
    - "!AGENTS.md"
    - "!README.md"
  resources:
    - "cv-full.pdf"
    - "cv-full-ja.pdf"

website:
  title: "Tomoharu Mori"
  navbar:
    left:
      - text: "Home"
        href: index.qmd
      - text: "CV"
        href: cv.qmd
      - text: "CV（日本語）"
        href: cv-ja.qmd

format:
  html:
    theme: [cosmo, custom.scss]
    css: styles.css
    toc: true
    toc-depth: 2
    toc-title: "Contents"
